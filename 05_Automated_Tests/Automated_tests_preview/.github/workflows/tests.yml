name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: CHANGE_ME_LOCAL_ONLY
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: CHANGE_ME_LOCAL_ONLY
      PGDATABASE: genapp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scripts/ dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install api/ dependencies
        run: pip install -r api/requirements.txt

      - name: Run migration (schema + sample data)
        working-directory: scripts
        run: >
          python3 run_migration.py --data-dir ../sample_data --validate
          --host localhost --dbname genapp --user postgres --password CHANGE_ME_LOCAL_ONLY

      - name: Run full test suite
        run: python3 run_all_tests.py
